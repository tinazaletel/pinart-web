<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Pot e-poste">
<defs>
  <style>
    .bg{fill:#F5F2EA}
    .t1{font-family:'DM Serif Display','Bodoni Moda',Georgia,serif;font-size:31px;fill:#111}
    .t2{font-family:'Archivo',system-ui,sans-serif;font-size:13.5px;fill:#55524C}
    .lab{font-family:'Archivo',system-ui,sans-serif;font-size:11px;fill:#55524C;letter-spacing:1.6px}
    .bx{font-family:'Archivo',system-ui,sans-serif;font-size:14.5px;font-weight:600;fill:#111}
    .sm{font-family:'Archivo',system-ui,sans-serif;font-size:11.5px;fill:#55524C}
    .xs{font-family:'Archivo',system-ui,sans-serif;font-size:9.5px;fill:#7A756B;letter-spacing:.5px}
    .xr{font-family:'Archivo',system-ui,sans-serif;font-size:9.5px;fill:#C0492E;letter-spacing:.5px;font-weight:600}
    .chip{font-family:'Archivo',system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.5px}
    .card{fill:#FFFFFF;stroke:#D8D4C8;stroke-width:1}
    .ln{stroke:#8A857A;stroke-width:1.4;fill:none}
    .lr{stroke:#C0492E;stroke-width:1.6;fill:none}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8A857A"/>
  </marker>
  <marker id="axr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#C0492E"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="780"/>
<text class="t1" x="60" y="68">Pot e-poste</text>
<text class="t2" x="60" y="96">Kje je posta sifrirana in kje ni. Vsak odsek posebej.</text>
<line x1="60" y1="130" x2="1140" y2="130" stroke="#D8D4C8" stroke-width="1"/>

<!-- ================= DOHODNA ================= -->
<text class="lab" x="60" y="170">DOHODNA &#8212; POSTA, KI PRIDE K NAM</text>

<rect class="card" x="60" y="188" width="190" height="104" rx="12"/>
<text class="bx" x="80" y="218">Posiljatelj</text>
<text class="sm" x="80" y="240">stranka posilja na</text>
<text class="sm" x="80" y="258">&lt;token&gt;@pinartflow.com</text>
<text class="sm" x="80" y="278">token = skriti naslov projekta</text>

<line class="ln" x1="250" y1="240" x2="352" y2="240" marker-end="url(#ar)"/>
<text class="xr" x="301" y="222" text-anchor="middle">SMTP</text>
<text class="xr" x="301" y="234" text-anchor="middle">TLS NI ZAJAMCEN</text>

<rect class="card" x="356" y="188" width="190" height="104" rx="12"/>
<text class="bx" x="376" y="218">Cloudflare</text>
<text class="sm" x="376" y="240">Email Routing</text>
<text class="sm" x="376" y="258">+ Worker, ki mail</text>
<text class="sm" x="376" y="276">razcleni na dele</text>

<line class="ln" x1="546" y1="240" x2="648" y2="240" marker-end="url(#ar)"/>
<text class="xs" x="597" y="222" text-anchor="middle">HTTPS +</text>
<text class="xs" x="597" y="234" text-anchor="middle">SKUPNA SKRIVNOST</text>

<rect class="card" x="652" y="188" width="190" height="104" rx="12"/>
<text class="bx" x="672" y="218">/api/posta/prejeto</text>
<text class="sm" x="672" y="240">na Vercelu</text>
<text class="sm" x="672" y="258">skrivnost se primerja</text>
<text class="sm" x="672" y="276">s timingSafeEqual</text>

<line class="ln" x1="842" y1="240" x2="944" y2="240" marker-end="url(#ar)"/>
<text class="xs" x="893" y="228" text-anchor="middle">HTTPS</text>

<rect class="card" x="948" y="188" width="190" height="104" rx="12"/>
<text class="bx" x="968" y="218">Supabase</text>
<text class="sm" x="968" y="240">project_mail</text>
<text class="sm" x="968" y="258">posta se pokaze pri</text>
<text class="sm" x="968" y="276">pravem projektu</text>

<!-- ================= ODHODNA ================= -->
<text class="lab" x="60" y="374">ODHODNA &#8212; POSTA, KI JO POSLJEMO</text>

<rect class="card" x="60" y="392" width="190" height="104" rx="12"/>
<text class="bx" x="80" y="422">Uporabnik</text>
<text class="sm" x="80" y="444">napise sporocilo</text>
<text class="sm" x="80" y="462">v Flowu</text>

<line class="ln" x1="250" y1="444" x2="352" y2="444" marker-end="url(#ar)"/>
<text class="xs" x="301" y="432" text-anchor="middle">HTTPS</text>

<rect class="card" x="356" y="392" width="190" height="104" rx="12"/>
<text class="bx" x="376" y="422">/api/posta</text>
<text class="sm" x="376" y="444">preveri prijavo,</text>
<text class="sm" x="376" y="462">clanstvo in</text>
<text class="sm" x="376" y="480">pogostost klicev</text>

<line class="ln" x1="546" y1="444" x2="648" y2="444" marker-end="url(#ar)"/>
<text class="xs" x="597" y="426" text-anchor="middle">HTTPS</text>
<text class="xs" x="597" y="438" text-anchor="middle">api.resend.com</text>

<rect class="card" x="652" y="392" width="190" height="104" rx="12"/>
<text class="bx" x="672" y="422">Resend</text>
<text class="sm" x="672" y="444">RESEND_API_KEY</text>
<text class="sm" x="672" y="462">bere SAMO streznik,</text>
<text class="sm" x="672" y="480">nikoli brskalnik</text>

<line class="lr" x1="842" y1="444" x2="944" y2="444" marker-end="url(#axr)"/>
<text class="xr" x="893" y="426" text-anchor="middle">SMTP &#183; STARTTLS</text>
<text class="xr" x="893" y="438" text-anchor="middle">NI ZAJAMCEN</text>

<rect class="card" x="948" y="392" width="190" height="104" rx="12"/>
<rect x="948" y="392" width="4.5" height="104" fill="#C0492E"/>
<text class="bx" x="968" y="422">Prejemnik</text>
<text class="sm" x="968" y="444">tuja infrastruktura,</text>
<text class="sm" x="968" y="462">nad katero nimamo</text>
<text class="sm" x="968" y="480">nobenega nadzora</text>

<!-- veja v bazo -->
<path class="ln" d="M451 496 L451 556" marker-end="url(#ar)"/>
<rect class="card" x="356" y="560" width="290" height="82" rx="12"/>
<text class="bx" x="376" y="588">Supabase</text>
<text class="sm" x="376" y="610">mail_log in project_mail</text>
<rect x="376" y="618" width="200" height="20" rx="10" fill="#F6EEDD"/>
<text class="chip" x="386" y="632" fill="#8A6420">VSEBINA SHRANJENA BERLJIVO</text>

<!-- opozorilo -->
<rect x="700" y="560" width="440" height="82" rx="12" fill="#FAE7E2" stroke="#E3BDB1"/>
<text class="bx" x="722" y="588" fill="#C0492E">Posta ni sifrirana od konca do konca</text>
<text class="sm" x="722" y="610" fill="#111">Zadnji odsek je navadna SMTP dostava. Ce streznik</text>
<text class="sm" x="722" y="628" fill="#111">prejemnika ne podpira TLS, gre sporocilo nezasciteno.</text>

<line x1="60" y1="690" x2="1140" y2="690" stroke="#D8D4C8" stroke-width="1"/>
<line class="ln" x1="60" y1="716" x2="96" y2="716" marker-end="url(#ar)"/>
<text class="sm" x="106" y="720">sifrirano v prenosu</text>
<line class="lr" x1="286" y1="716" x2="322" y2="716" marker-end="url(#axr)"/>
<text class="sm" x="332" y="720">sifriranje ni zajamceno</text>
<text class="xs" x="1140" y="720" text-anchor="end">Pinart Flow &#183; 22. 8. 2026</text>
</svg>
