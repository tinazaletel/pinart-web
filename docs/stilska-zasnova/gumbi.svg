<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="964" viewBox="0 0 1120 964"><rect x="0" y="0" width="1120" height="1180" fill="#F7F4EE"/><text x="64" y="84" font-family="Archivo, Inter, sans-serif" font-size="12" font-weight="700" fill="#8B5CF6" text-anchor="start" letter-spacing="2.4">PINART FLOW · STILSKA ZASNOVA</text><text x="64" y="132" font-family="Archivo, Inter, sans-serif" font-size="40" font-weight="400" fill="#221E19" text-anchor="start" letter-spacing="0">Gumbi</text><text x="64" y="166" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="start" letter-spacing="0">Trije toni, dve obliki, tri velikosti. Kar ni tu, ne obstaja.</text><text x="64" y="266.0" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">POLNI · VELIK</text><rect x="300" y="240" width="170" height="44" rx="22.0" fill="#221E19"/><text x="385.0" y="267.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#F7F4EE" text-anchor="middle" letter-spacing="0">Shrani ponudbo</text><rect x="488.0" y="240" width="152" height="44" rx="22.0" fill="#8B5CF6"/><text x="564.0" y="267.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Vprašaj Pupo</text><rect x="658.0" y="240" width="98" height="44" rx="22.0" fill="#E7E3DA"/><text x="707.0" y="267.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">Pošlji</text><text x="64" y="348.0" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">POLNI · SREDNJI</text><rect x="300" y="326" width="84" height="36" rx="18.0" fill="#221E19"/><text x="342.2" y="349.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#F7F4EE" text-anchor="middle" letter-spacing="0">Shrani</text><rect x="402.4" y="326" width="101" height="36" rx="18.0" fill="#8B5CF6"/><text x="453.0" y="349.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Nadgradi</text><rect x="521.6" y="326" width="101" height="36" rx="18.0" fill="#E7E3DA"/><text x="572.2" y="349.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">Prekliči</text><text x="64" y="423.0" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">POLNI · MAJHEN</text><rect x="300" y="404" width="67" height="30" rx="15.0" fill="#221E19"/><text x="333.5" y="423.68" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="700" fill="#F7F4EE" text-anchor="middle" letter-spacing="0">Dodaj</text><rect x="385.0" y="404" width="59" height="30" rx="15.0" fill="#8B5CF6"/><text x="414.6" y="423.68" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Pupa</text><rect x="462.2" y="404" width="67" height="30" rx="15.0" fill="#E7E3DA"/><text x="495.7" y="423.68" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">Zapri</text><text x="64" y="502.0" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">OBROBLJENI · VELIK</text><rect x="300" y="476" width="143" height="44" rx="22.0" fill="none" stroke="#B9B3A8" stroke-width="1.5"/><text x="371.5" y="503.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#221E19" text-anchor="middle" letter-spacing="0">Prenesi PDF</text><rect x="461.0" y="476" width="161" height="44" rx="22.0" fill="none" stroke="#C4AEFB" stroke-width="1.5"/><text x="541.5" y="503.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="0">Uredi pravice</text><rect x="640.0" y="476" width="89" height="44" rx="22.0" fill="none" stroke="#E6E1D8" stroke-width="1.5"/><text x="684.5" y="503.4" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">Nazaj</text><text x="64" y="584.0" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">OBROBLJENI · SREDNJI</text><rect x="300" y="562" width="93" height="36" rx="18.0" fill="none" stroke="#B9B3A8" stroke-width="1.5"/><text x="346.4" y="585.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#221E19" text-anchor="middle" letter-spacing="0">Prenesi</text><rect x="410.8" y="562" width="76" height="36" rx="18.0" fill="none" stroke="#C4AEFB" stroke-width="1.5"/><text x="448.8" y="585.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="0">Uredi</text><rect x="504.8" y="562" width="76" height="36" rx="18.0" fill="none" stroke="#E6E1D8" stroke-width="1.5"/><text x="542.8" y="585.04" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">Nazaj</text><text x="64" y="658" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">IKONSKI · 36 px krog</text><circle cx="318" cy="648" r="18" fill="none" stroke="#B9B3A8" stroke-width="1.5"/><text x="318" y="654" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#221E19" text-anchor="middle" letter-spacing="0">✎</text><circle cx="372" cy="648" r="18" fill="none" stroke="#E6E1D8" stroke-width="1.5"/><text x="372" y="654" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#6F6A62" text-anchor="middle" letter-spacing="0">✕</text><circle cx="426" cy="648" r="18" fill="none" stroke="#C4AEFB" stroke-width="1.5"/><text x="426" y="654" font-family="Archivo, Inter, sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="0">+</text><line x1="64" y1="714" x2="1056" y2="714" stroke="#E6E1D8" stroke-width="1"/><text x="64" y="754" font-family="Archivo, Inter, sans-serif" font-size="11" font-weight="700" fill="#6F6A62" text-anchor="start" letter-spacing="1.4">MERE</text><text x="64" y="784" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="500" fill="#221E19" text-anchor="start" letter-spacing="0">velik      višina 44 px    padding 0 22 px    pisava 700 / 15 px    glavno dejanje zaslona, noge</text><text x="64" y="810" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="500" fill="#221E19" text-anchor="start" letter-spacing="0">srednji    višina 36 px    padding 0 17 px    pisava 700 / 14 px    paneli, obrazci, kartice</text><text x="64" y="836" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="500" fill="#221E19" text-anchor="start" letter-spacing="0">majhen     višina 30 px    padding 0 14 px    pisava 700 / 13 px    vrstice v seznamih</text><text x="64" y="862" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="500" fill="#221E19" text-anchor="start" letter-spacing="0">ikonski    krog 36 px      brez besedila                            ena sama ikona</text><text x="64" y="904" font-family="Archivo, Inter, sans-serif" font-size="13" font-weight="400" fill="#6F6A62" text-anchor="start" letter-spacing="0">Zaobljenost je vedno polovica višine (pilula). Rdeča nikoli ne polni gumba — samo ob dotiku na obrobljenem košu.</text></svg>